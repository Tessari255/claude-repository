name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, tipos e testes com Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -q -r backend/requirements-dev.txt
      - name: Lint e tipos
        run: |
          cd backend
          .venv/bin/ruff check app tests ../executor
          .venv/bin/pyright
      - name: Imagem do executor isolado
        run: ./scripts/build-executor.sh
      - name: Testes
        run: cd backend && .venv/bin/python -m pytest -q

  frontend:
    name: Frontend (lint, tipos, unitários)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  e2e:
    name: Navegador (Playwright + axe)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -q -r backend/requirements-dev.txt
      - run: ./scripts/build-executor.sh
      - run: cd frontend && npm ci --no-audit --no-fund && npx vite build && npx playwright install --with-deps chromium
      - run: cd frontend && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
